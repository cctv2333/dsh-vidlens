name: release

# Tag a commit `v*` to publish to npm and attach the tarball to a GitHub Release.
#
# Auth is OIDC Trusted Publishing — there is no NPM_TOKEN and no secret to rotate.
# One-time setup on npmjs.com (must be done AFTER the package exists once):
#   your package → Settings → Trusted Publisher → GitHub Actions
#     Organization or user : cctv2333
#     Repository           : dsh-vidlens
#     Workflow filename    : release.yml
#     Environment name     : (leave empty)
#     Allowed actions      : npm publish
# Requires npm >= 11.5.1 and Node >= 22.14 (Node 24 is used below).
#
# First publish cannot use OIDC (the package has no settings page yet): run
# `npm publish --access public` once locally, then add the trusted publisher.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write          # required for OIDC

jobs:
  publish:
    name: publish to npm (OIDC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: show npm version (must be >= 11.5.1)
        run: npm --version

      - name: pack once and keep the exact artifact
        run: npm pack 2>/dev/null

      - name: publish (no token)
        run: npm publish --access public

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tgz
          generate_release_notes: true
