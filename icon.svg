<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VidLens">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="round">
      <rect x="4" y="4" width="248" height="248" rx="52"/>
    </clipPath>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="52" fill="url(#bg)"/>

  <g clip-path="url(#round)">
    <!-- timecode ticks: the evidence layer -->
    <g stroke="#38bdf8" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
      <line x1="28" y1="206" x2="28" y2="220"/>
      <line x1="58" y1="200" x2="58" y2="220"/>
      <line x1="88" y1="206" x2="88" y2="220"/>
      <line x1="118" y1="200" x2="118" y2="220"/>
      <line x1="148" y1="206" x2="148" y2="220"/>
      <line x1="178" y1="200" x2="178" y2="220"/>
      <line x1="208" y1="206" x2="208" y2="220"/>
    </g>
    <line x1="28" y1="220" x2="228" y2="220" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="4" stroke-linecap="round"/>

    <!-- lens ring -->
    <circle cx="128" cy="112" r="62" fill="none" stroke="url(#lens)" stroke-width="12"/>
    <circle cx="128" cy="112" r="44" fill="#0b1220" fill-opacity="0.55"/>

    <!-- aperture blades: sampling, not watching everything -->
    <g stroke="#22d3ee" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <line x1="128" y1="72" x2="107" y2="108"/>
      <line x1="163" y1="97" x2="149" y2="139"/>
      <line x1="93" y1="97" x2="107" y2="139"/>
    </g>

    <!-- play: what the frame shows -->
    <path d="M117 90 L157 112 L117 134 Z" fill="#f8fafc"/>

    <!-- focus handle -->
    <line x1="172" y1="158" x2="205" y2="190" stroke="#38bdf8" stroke-width="13" stroke-linecap="round"/>
  </g>
</svg>
